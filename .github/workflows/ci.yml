name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            files: tests/test_codec.py tests/test_config.py tests/test_mqtt_map.py tests/test_setup_cli.py
          - name: network
            files: tests/test_server.py tests/test_relay.py tests/test_web.py tests/test_app.py
    name: shard (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -n auto -q ${{ matrix.files }}

  tests:
    # single required check name
    if: always()
    needs: [lint, shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs green
        run: |
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.shard.result }}" = "success" ]
