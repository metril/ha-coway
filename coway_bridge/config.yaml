name: Coway Bridge
version: "0.2.6"
slug: coway_bridge
description: Local control of Coway Airmega 400S (AP-2015E) purifiers via MQTT discovery
url: https://github.com/metril/ha-coway
arch:
  - amd64
  - aarch64
image: ghcr.io/metril/{arch}-coway-bridge
services:
  - "mqtt:want"
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:air-purifier
panel_title: Coway Bridge
ports:
  9090/tcp: 9090
ports_description:
  9090/tcp: Purifier connection (redirect the purifier's cloud traffic here)
options:
  allowed_macs: []
  cloud_relay: false
  cloud_host: iocgwo.coway.co.kr:9090
  log_frames_to_file: false
  log_level: info
schema:
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool?
  mqtt_base_topic: str?
  allowed_macs:
    - str
  cloud_relay: bool
  cloud_host: str
  log_frames_to_file: bool
  log_level: list(debug|info|warning|error)
